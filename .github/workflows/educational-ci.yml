name: Educational CI/CD Pipeline (Учебная работа №2)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ========== ЭТАП 1: СБОРКА ==========
  build:
    name: 1. Сборка программы
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make

      - name: Build program
        run: make

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferma-test-binary
          path: ferma-test
          retention-days: 1

  # ========== ЭТАП 2: ТЕСТИРОВАНИЕ ==========
  test:
    name: 2. Запуск unit-тестов
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ferma-test-binary
          path: .

      - name: Make binary executable
        run: chmod +x ferma-test

      - name: Compile and run unit tests
        run: |
          mkdir -p test-results
          cd tests
          g++ -I../include test_ferma.cpp ../src/ferma.cpp -o test_runner
          ./test_runner 2>&1 | tee ../test-results/output.txt
          cd ..

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
        if: always()

  # ========== ЭТАП 3: УПАКОВКА В DEB ==========
  package:
    name: 3. Упаковка в .deb пакет
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ferma-test-binary
          path: .

      - name: Make binary executable
        run: chmod +x ferma-test

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev

      - name: Copy binary to debian structure
        run: |
          mkdir -p debian/ferma-test/usr/local/bin
          cp ferma-test debian/ferma-test/usr/local/bin/
          chmod 755 debian/ferma-test/usr/local/bin/ferma-test

      - name: Build .deb package
        run: |
          # ФИКСИРУЕМ ВЕРСИЮ 1.0.0 (НЕ БЕРЁМ ИЗ GITHUB_REF_NAME)
          VERSION="1.0.0"
          
          echo "Building version: ${VERSION}"
          
          # Обновляем версию
          sed -i "s/Version: .*/Version: ${VERSION}/" debian/ferma-test/DEBIAN/control
          
          # Добавляем пустую строку в конец Description
          echo "" >> debian/ferma-test/DEBIAN/control
          
          # Диагностика
          echo "=== Control file content ==="
          cat debian/ferma-test/DEBIAN/control
          echo "============================"
          
          # Собираем пакет
          dpkg-deb --build debian/ferma-test
          mv debian/ferma-test.deb ferma-test_${VERSION}_amd64.deb
          
          echo "✅ Пакет создан: ferma-test_${VERSION}_amd64.deb"

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ferma-test_*.deb
          retention-days: 14

  # ========== ЭТАП 4: СОЗДАНИЕ РЕЛИЗА ==========
  release:
    name: 4. Создание релизной версии
    needs: package
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download .deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/ferma-test_*.deb
          draft: false
          prerelease:
            false
          generate_release_notes: true
          name: "Релиз ${{ github.ref_name }}"
          body: |
            ## Релиз программы Ferma Prime Test
            
            ### Что включает этот релиз:
            - ✅ Собранный бинарный файл `ferma-test`
            - 📦 DEB пакет для установки на Ubuntu/Debian
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}